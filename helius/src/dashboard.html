<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老币趋势观察</title><style>body{background:#0c121b;color:#e5eef8;font:16px system-ui;margin:0;padding:40px}main{max-width:1200px;margin:auto}h1{font-size:34px}small,p{color:#9eafc3}section{background:#162130;border:1px solid #29394d;border-radius:16px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:20px;background:#162130;border-radius:14px}.card strong{display:block;font-size:27px;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #29394d}a{color:#69dfc3}button,input{background:#23364b;color:white;padding:10px;border:1px solid #51637c;border-radius:8px}pre{white-space:pre-wrap;word-break:break-all}#tables{overflow:auto}</style><main><small>HELIUS / SHADOW ONLY</small><h1>老币放量 · 趋势观察</h1><p>毕业满24小时 · $10,000 / $20,000 两档 · 突破 / 回踩 · 无真实下单</p><div id="login" hidden><input id="token" type="password" placeholder="面板访问令牌"><button onclick="auth()">连接</button></div><p id="status">读取中</p><div class="grid" id="cards"></div><section><h2>预选池</h2><div id="watch"></div></section><section><h2>模拟持仓</h2><p>不同研究组独立记账，不代表可同时投入的组合收益。</p><div id="positions"></div></section><section><h2>最近研究事件</h2><p>分页展示最近500条；完整记录进入每日归档。</p><button onclick="page=Math.max(1,page-1);load()">上一页</button> <span id="page"></span> <button onclick="page++;load()">下一页</button><div id="events"></div></section></main><script>
let page=1;const $=id=>document.getElementById(id),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mint=m=>m&&/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(m)?'<a target="_blank" rel="noopener noreferrer" href="https://gmgn.ai/sol/token/'+m+'">'+esc(m.slice(0,6)+'…'+m.slice(-5))+'</a>':'—';function table(rows,cols){return '<table><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+c[1](r)+'</td>').join('')+'</tr>').join('')+'</table>';}function auth(){sessionStorage.setItem('trendToken',$('token').value);load();}
async function load(){try{const r=await fetch('/api/state?page='+page,{headers:{Authorization:'Bearer '+(sessionStorage.getItem('trendToken')||'')}});if(r.status===401){$('login').hidden=false;$('status').textContent='请输入已有面板令牌';return;}if(!r.ok)throw Error();const d=await r.json();$('login').hidden=true;$('status').textContent=(d.connected?'行情已连接':'行情未连接')+' · 数据时间 '+new Date(d.at).toLocaleString()+' · SOL美元价为Helius缓存估值，非实时成交价';const cards=[['监测池',d.pools],['已验证老池',d.oldPools],['AGE待核验',d.ageQueue],['模拟持仓',d.positions.length],['累计完整平仓',d.totals.closed],['结果未知',d.totals.unknown],['今日流量GB',(d.bytesToday/1e9).toFixed(3)],['RPC请求',d.rpc?.requests]];$('cards').innerHTML=cards.map(([k,v])=>'<div class="card">'+k+'<strong>'+esc(v)+'</strong></div>').join('');$('watch').innerHTML=table(d.watchlist||[],[['代币',r=>mint(r.mint)],['入选时间',r=>esc(new Date(r.since).toLocaleString())]]);$('positions').innerHTML=table(d.positions,[['代币',r=>mint(r.mint)],['研究组',r=>esc(r.arm)],['已持仓秒',r=>((Date.now()-r.openedAt)/1000).toFixed(0)],['估算净收益SOL',r=>r.lastNet?.toFixed(6)??'—']]);$('page').textContent=page+' / '+Math.max(1,Math.ceil(d.pagination.total/20));$('events').innerHTML=table(d.events,[['时间',r=>esc(new Date(r.at).toLocaleTimeString())],['事件',r=>esc(r.type)],['代币',r=>mint(r.mint)],['研究组/原因',r=>esc(r.arm||r.reason||'')]]);}catch{$('status').textContent='尚未取得新策略状态';}}load();setInterval(load,5000);
</script></html>
